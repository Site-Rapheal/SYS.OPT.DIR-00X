<!DOCTYPE html>
<html lang="en">
<head>

    <!-- THE STEALTH CLOAK: Blocks all search engines from finding this page -->

    <style>
        :root {
            --neon-green: #4ade80;
            --neon-glow: rgba(74, 222, 128, 0.4);
            --bg-dark: #050806;
            --card-bg: rgba(5, 8, 6, 0.75);
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Aligns content toward the bottom void */
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- DESKTOP FIX: Blurred glowing background for wide screens --- */
        .bg-blur {
            position: fixed;
            top: -5%; left: -5%; width: 110%; height: 110%;
            background-image: url('photo_2026-05-24_15-01-30.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(30px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        /* --- DESKTOP FIX: Centered portrait image --- */
        .bg-main {
            position: fixed;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 550px; /* Constrains the image so it doesn't zoom out of control */
            height: 100%;
            background-image: url('photo_2026-05-24_15-01-30.jpg');
            background-size: cover;
            background-position: center top;
            z-index: 0;
            pointer-events: none;
        }

        /* Cinematic Void Gradient Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0.95) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px 60px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .header p {
            color: var(--neon-green);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            opacity: 0.8;
        }

        /* Link Buttons */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 18px 22px;
            margin-bottom: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 16px;
            color: var(--neon-green);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: rgba(10, 20, 15, 0.85);
            border-color: var(--neon-green);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 20px var(--neon-glow);
            color: #fff;
        }

        .link-btn:active {
            transform: translateY(1px);
        }

        /* Icon Styling inside buttons */
        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 8px;
            color: var(--neon-green);
        }

        .link-btn:hover .btn-icon {
            background: var(--neon-green);
            color: var(--bg-dark);
        }

        .arrow-icon {
            opacity: 0.5;
            transition: opacity 0.3s, transform 0.3s;
        }

        .link-btn:hover .arrow-icon {
            opacity: 1;
            transform: translateX(4px);
        }

        .footer {
            margin-top: 30px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- MOBILE OPTIMIZATIONS --- */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px 40px 15px;
            }
            .header h1 {
                font-size: 24px;
            }
            .link-btn {
                padding: 14px 18px; /* Slightly smaller buttons on mobile */
                font-size: 13px;
                border-radius: 14px;
                margin-bottom: 12px;
            }
            .btn-icon {
                width: 28px;
                height: 28px;
                border-radius: 6px;
            }
            .btn-icon svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
